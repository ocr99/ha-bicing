name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release Bicing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(
                  f"Invalid version {version!r}. Use semantic versioning such as 1.3.0.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"Releasing version {version}")
          PY

      - name: Update manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "custom_components/bicing/manifest.json"
          version = os.environ["VERSION"].strip()

          with open(path, encoding="utf-8") as file:
              manifest = json.load(file)

          old_version = manifest["version"]
          manifest["version"] = version

          with open(path, "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2, ensure_ascii=False)
              file.write("\n")

          print(f"Updated manifest version: {old_version} -> {version}")
          PY

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-homeassistant-custom-component

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Commit manifest version
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_components/bicing/manifest.json

          if git diff --cached --quiet; then
            echo "No manifest change needed."
          else
            git commit -m "Release v${VERSION}"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG"             --verify-tag             --title "$TAG"             --generate-notes
