name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: 1.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Prepare and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"].strip()
          if not re.fullmatch(r"0|[1-9]\d*\.\d+\.\d+", version):
              print(f"Invalid version: {version!r}. Use MAJOR.MINOR.PATCH, for example 1.3.0.", file=sys.stderr)
              raise SystemExit(1)
          print(f"Preparing release v{version}")
          PY

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists." >&2
            exit 1
          fi

      - name: Update manifest version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/bicing/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"].strip()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Generate GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | head -n 1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ github.ref_name }}" \
              -f previous_tag_name="$PREVIOUS_TAG" \
              --jq '.body' > release-notes.md
          else
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ github.ref_name }}" \
              --jq '.body' > release-notes.md
          fi

          test -s release-notes.md
          echo "Generated release notes:"
          cat release-notes.md

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          version = os.environ["VERSION"].strip()
          today = date.today().isoformat()

          existing = changelog.read_text(encoding="utf-8") if changelog.exists() else "# Changelog\n"
          if not existing.startswith("# Changelog"):
              existing = "# Changelog\n\n" + existing

          section = f"## {version} - {today}\n\n{notes}\n\n"
          prefix = "# Changelog\n"
          remainder = existing[len(prefix):].lstrip("\n") if existing.startswith(prefix) else existing
          changelog.write_text(f"{prefix}\n{section}{remainder}", encoding="utf-8")
          PY

      - name: Validate generated changes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m json.tool custom_components/bicing/manifest.json >/dev/null
          python - <<'PY'
          import json
          import os
          import sys

          with open("custom_components/bicing/manifest.json", encoding="utf-8") as file:
              version = json.load(file)["version"]
          expected = os.environ["VERSION"]
          if version != expected:
              print(f"manifest.json contains {version!r}, expected {expected!r}", file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip pytest pytest-homeassistant-custom-component
          pytest -q

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Commit release files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/bicing/manifest.json CHANGELOG.md
          git commit -m "Release ${TAG}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --verify-tag \
            --title "ha-bicing $TAG" \
            --notes-file release-notes.md
