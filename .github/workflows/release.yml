name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.5.0). Leave empty to auto-bump the patch version (X.Y.Z -> X.Y.(Z+1))."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Prepare and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve release version
        id: resolve_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def version_tuple(value: str) -> tuple[int, int, int]:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
              if not match:
                  raise ValueError(value)
              return tuple(map(int, match.groups()))

          path = Path("custom_components/bicing/manifest.json")
          current = json.loads(path.read_text(encoding="utf-8"))["version"]
          requested = os.environ.get("REQUESTED_VERSION", "").strip()

          if requested:
              # El usuario ha indicado una versión explícita: se valida el
              # formato y que no sea anterior a la actual (igual que antes).
              if not re.fullmatch(r"0|[1-9]\d*\.\d+\.\d+", requested):
                  print(
                      f"Invalid version: {requested!r}. Use MAJOR.MINOR.PATCH, for example 1.5.0.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

              if version_tuple(requested) < version_tuple(current):
                  print(
                      f"Requested version {requested} is older than manifest version {current}.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

              resolved = requested
          else:
              # Campo vacío: se calcula automáticamente la siguiente versión
              # "patch" (X.Y.Z -> X.Y.(Z+1)) a partir de manifest.json.
              major, minor, patch = version_tuple(current)
              resolved = f"{major}.{minor}.{patch + 1}"
              print(f"No version provided: auto-bumping patch version {current} -> {resolved}")

          print(f"Current manifest version: {current}")
          print(f"Resolved release version: {resolved}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={resolved}\n")
          PY

      - name: Check tag and release do not conflict
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists. Refusing to recreate it."
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists. Refusing to recreate it."
            exit 1
          fi

      - name: Update manifest version
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/bicing/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"].strip()
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate generated files
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          python -m json.tool custom_components/bicing/manifest.json >/dev/null
          python -m json.tool custom_components/bicing/translations/es.json >/dev/null

          python - <<'PY'
          import json
          import os
          import sys

          with open("custom_components/bicing/manifest.json", encoding="utf-8") as file:
              version = json.load(file)["version"]

          expected = os.environ["VERSION"]
          if version != expected:
              print(
                  f"manifest.json contains {version!r}, expected {expected!r}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-homeassistant-custom-component
          pytest -q

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Commit release files
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_components/bicing/manifest.json

          if git diff --cached --quiet; then
            echo "No release file changes to commit."
          else
            git commit -m "Release ${TAG}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Generate automatic release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${{ github.ref_name }}" \
            --jq '.body' > release-notes.md

          test -s release-notes.md

          echo "Generated release notes:"
          cat release-notes.md

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = os.environ["VERSION"].strip()
          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          changelog = Path("CHANGELOG.md")

          existing = (
              changelog.read_text(encoding="utf-8")
              if changelog.exists()
              else "# Changelog\n"
          )

          if not existing.startswith("# Changelog"):
              existing = "# Changelog\n\n" + existing

          prefix = "# Changelog\n"
          remainder = existing[len(prefix):].lstrip("\n")
          section = f"## {version} - {date.today().isoformat()}\n\n{notes}\n\n"

          pattern = re.compile(
              rf"^##\s+{re.escape(version)}\s+-.*?(?=^##\s|\Z)",
              re.MULTILINE | re.DOTALL,
          )

          if pattern.search(remainder):
              remainder = pattern.sub(section.rstrip("\n"), remainder, count=1)
          else:
              remainder = section + remainder

          changelog.write_text(
              prefix + "\n" + remainder.lstrip("\n"),
              encoding="utf-8",
          )
          PY

      - name: Commit CHANGELOG.md
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No CHANGELOG changes to commit."
          else
            git commit -m "docs: update CHANGELOG for ${TAG}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create tag
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          gh release create "${TAG}" \
            --verify-tag \
            --title "ha-bicing ${TAG}" \
            --notes-file release-notes.md